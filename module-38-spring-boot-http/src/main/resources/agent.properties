# The agent application (HttpAgentApplication, spring.config.name=agent).
# Serve the @AcpAgent bean over Streamable HTTP. With no web server on the classpath this is a
# non-web application, so the SDK's Spring Boot starter runs the SDK's own Jetty listener
# (StreamableHttpAcpAgentTransport), which also accepts WebSocket upgrades on the same path.
spring.acp.agent.transport.type=http
spring.acp.agent.transport.http.listener.port=8080
spring.acp.agent.transport.http.path=/acp

# Nothing else keeps a non-web application's JVM alive.
spring.main.keep-alive=true
spring.main.banner-mode=off
logging.level.root=warn
