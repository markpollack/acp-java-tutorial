# The client application (HttpClientApplication, spring.config.name=client).
# The transport is chosen at run time, by the property the demo passes:
#   spring.acp.client.transport.http.uri=http://localhost:8080/acp       (Streamable HTTP)
#   spring.acp.client.transport.websocket.uri=ws://localhost:8080/acp    (WebSocket)
# The starter builds the transport from whichever is set.

# The client advertises fs/read_text_file only because the AcpClientCustomizer registers a handler for it.
# The starter defaults both file capabilities to false.
spring.acp.client.capabilities.read-text-file=true

spring.main.banner-mode=off
logging.level.root=warn
