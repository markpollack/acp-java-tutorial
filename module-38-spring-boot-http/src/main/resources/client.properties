# The client application (HttpClientApplication, spring.config.name=client).
# The transport is chosen at run time: demo.agent.url makes the application define a Streamable HTTP
# transport bean. (acp-autoconfig 0.13.0 creates stdio and WebSocket client transports from properties,
# but not Streamable HTTP.)

# The client advertises fs/read_text_file only because the AcpClientCustomizer registers a handler for it.
# acp-autoconfig 0.13.0 defaults both file capabilities to false.
spring.acp.client.capabilities.read-text-file=true

spring.main.banner-mode=off
logging.level.root=warn
