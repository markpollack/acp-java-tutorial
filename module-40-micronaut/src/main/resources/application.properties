# Module 40: the Micronaut application's configuration (acp-micronaut reads acp.*).
micronaut.application.name=module-40-micronaut

# The agent: stdio by default. Standard output then carries the protocol, so the banner is off
# (Application.main) and slf4j-simple logs to standard error (simplelogger.properties).
# Run with --acp.agent.transport.type=http to serve Streamable HTTP and WebSocket instead, on the
# SDK's own listener port (not Micronaut's HTTP server port). The listener's own keys (host, port)
# sit under acp.agent.transport.http.listener; it binds 127.0.0.1 unless listener.host says otherwise.
acp.agent.transport.type=stdio
acp.agent.transport.http.listener.port=8080
acp.agent.transport.http.path=/acp

# An ACP WebSocket is a long-lived session, so ACP has its own idle timeout, separate from HTTP keep-alive tuning; the initialize deadline closes connections that never start. These are the defaults.
acp.agent.transport.http.web-socket-idle-timeout=30m
acp.agent.transport.http.initialize-timeout=30s

# Injected into the agent bean (Greeter).
greeter.salutation=Hello from Micronaut
