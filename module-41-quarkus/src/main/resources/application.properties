# Module 41: the Quarkus application's configuration (acp-quarkus reads quarkus.acp.*).

# Build time: serve the @AcpAgent over Streamable HTTP and WebSocket at /acp on the Quarkus HTTP
# server (the SDK's servlet on quarkus-undertow plus a Vert.x WebSocket route; no second server).
# Without it the application is a stdio agent. A stdio agent cannot run under `quarkus dev`, which
# owns the terminal's standard input: develop one in tests, or over HTTP as here.
quarkus.acp.agent.transport.type=http
quarkus.acp.agent.transport.http.path=/acp

# Run time: the port is Quarkus's own (the demo passes -Dquarkus.http.port=<a free port>).
quarkus.http.port=8080
quarkus.http.host=localhost
quarkus.banner.enabled=false
quarkus.log.level=WARN

# Injected into the agent bean (Greeting).
greeting.salutation=Hello from Quarkus
